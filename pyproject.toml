[project]
name = "metadata-stratified-active-learning"
version = "0.1.0"
description = "Cải thiện Active Learning cho Object Detection bằng Metadata-Stratified Sampling"
requires-python = ">=3.9"

dependencies = [
    # ML Core
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    
    # Data
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    
    # Config & Utils
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    
    # ML Tracking
    "mlflow>=2.8.0",
    
    # Database (DE minimal)
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    
    # Dev & Testing
    "jupyter>=1.0.0",
    "pytest>=7.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"